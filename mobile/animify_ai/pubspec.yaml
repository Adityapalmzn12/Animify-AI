name: animify_ai
description: Turn Any Video Into Animated Magic - AI-powered video animation platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Network
  dio: ^5.8.0
  pretty_dio_logger: ^1.4.0

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Authentication
  google_sign_in: ^6.2.2

  # UI Components
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # Video
  video_player: ^2.9.5
  chewie: ^1.10.0
  image_picker: ^1.1.2
  file_picker: ^8.3.7

  # Forms & Validation
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.0.0

  # Payments
  razorpay_flutter: ^1.3.7

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  connectivity_plus: ^6.1.3
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # JSON Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Logging
  logger: ^2.5.0

  # Icons
  cupertino_icons: ^1.0.8

  # Animations
  flutter_animate: ^4.5.2
  animations: ^2.0.11

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Analytics & Crash Reporting
  firebase_core: ^3.13.0
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.4

  # Environment
  envied: ^1.1.0

  # Functional Programming
  fpdart: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  json_serializable: ^6.9.4
  freezed: ^2.5.8
  injectable_generator: ^2.6.2
  go_router_builder: ^2.9.0
  envied_generator: ^1.1.0

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
