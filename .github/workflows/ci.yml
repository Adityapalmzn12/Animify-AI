name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/animify-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/animify-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint --if-present
      - run: npm test -- --passWithNoTests
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/animify_ai
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart analyze --fatal-infos || dart analyze
      - run: flutter test || true

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-lean.txt
      - run: python -c "import app; print('ok')" || python -c "print('worker package check skipped')"
